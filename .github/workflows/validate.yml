name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check braumeister-display-card.js
      - run: node test.cjs
      - run: node test-i18n.cjs
      - run: node scripts/build.cjs
      - run: git diff --exit-code -- dist/
      - run: node --check dist/braumeister-display-card.js
      - run: node test-bundle.cjs
      - run: node test-lighting.cjs
      - run: node test-menu.cjs
      - run: node test-connection.cjs
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
