# Installed through the HA automation UI; helper created separately.
# Helpers: input_boolean.braumeister_tablet_wake_armed (restore previous state)
# and input_text.braumeister_tablet_off_timestamp (default state restoration).
# This is one automation, not a Home Assistant package.
alias: Braumeister Tablet – Displayautomatik
description: >-
  Aus: unter 0,5 W fuer 30 s. Ein: ueber 1,5 W, online und neuer
  Geraete-Zeitstempel seit dem Ausschalten fuer 5 s. Ein Weckversuch pro gemessenem Aus/Ein-Zyklus.
  Manuelles Ausschalten bleibt erhalten. Schaltet niemals den Smartplug.
mode: queued
max: 5
triggers:
  - trigger: template
    id: powered_off
    value_template: >-
      {% set p = states('sensor.braumeister_20l_r_s60_3_power') %}
      {{ is_number(p) and 0 <= p | float < 0.5 }}
    for: '00:00:30'
  - trigger: template
    id: wake
    value_template: >-
      {% set p = states('sensor.braumeister_20l_r_s60_3_power') %}
      {% set seen = state_attr('binary_sensor.badezimmer_braumeister_20l_plus_gerateverbindung_prufen', 'last_device_timestamp') %}
      {% set baseline = states('input_text.braumeister_tablet_off_timestamp') %}
      {{ is_state('input_boolean.braumeister_tablet_wake_armed', 'on')
         and is_number(p) and p | float > 1.5
         and is_state('sensor.badezimmer_braumeister_20l_plus_verbindungsstatus_2', 'online')
         and is_number(seen) and is_number(baseline) and seen | float > baseline | float
         and states('switch.fire_tablet_bildschirm') in ['on', 'off'] }}
    for: '00:00:05'
  - trigger: state
    id: screen_off
    entity_id: switch.fire_tablet_bildschirm
    from: 'on'
    to: 'off'
conditions:
  - condition: template
    value_template: "{{ trigger is defined and trigger.id in ['powered_off', 'wake', 'screen_off'] }}"
actions:
  - choose:
      - conditions: "{{ trigger.id == 'powered_off' }}"
        sequence:
          - condition: template
            value_template: >-
              {% set p = states('sensor.braumeister_20l_r_s60_3_power') %}
              {{ is_number(p) and 0 <= p | float < 0.5 }}
          - action: input_text.set_value
            target:
              entity_id: input_text.braumeister_tablet_off_timestamp
            data:
              value: "{{ state_attr('binary_sensor.badezimmer_braumeister_20l_plus_gerateverbindung_prufen', 'last_device_timestamp') }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.braumeister_tablet_wake_armed
          - action: switch.turn_off
            target:
              entity_id: switch.fire_tablet_bildschirm
      - conditions: "{{ trigger.id == 'screen_off' }}"
        sequence:
          - condition: template
            value_template: >-
              {% set p = states('sensor.braumeister_20l_r_s60_3_power') %}
              {{ not (is_number(p) and 0 <= p | float < 0.5) }}
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.braumeister_tablet_wake_armed
      - conditions: "{{ trigger.id == 'wake' }}"
        sequence:
          - condition: state
            entity_id: input_boolean.braumeister_tablet_wake_armed
            state: 'on'
          - condition: template
            value_template: >-
              {% set p = states('sensor.braumeister_20l_r_s60_3_power') %}
              {% set seen = state_attr('binary_sensor.badezimmer_braumeister_20l_plus_gerateverbindung_prufen', 'last_device_timestamp') %}
              {% set baseline = states('input_text.braumeister_tablet_off_timestamp') %}
              {{ is_number(p) and p | float > 1.5
                 and is_state('sensor.badezimmer_braumeister_20l_plus_verbindungsstatus_2', 'online')
                 and is_number(seen) and is_number(baseline) and seen | float > baseline | float
                 and states('switch.fire_tablet_bildschirm') in ['on', 'off'] }}
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.braumeister_tablet_wake_armed
          - action: switch.turn_on
            target:
              entity_id: switch.fire_tablet_bildschirm
